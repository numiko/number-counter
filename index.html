<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-10 h-[1000vh]">

    <div data-js-number-counter>
      123456
    </div>

    <div data-js-number-counter>
      <p>I am 123424.56 years old and another number 1234,567.89</p>
      <p>I am <strong>123424.56</strong> years old and another number 1234,567.89</p>
    </div>

    <div data-js-number-counter data-js-number-counter-start-value="5000000">
      <p>I am 123424.56 years old and another number 1234,567.89</p>
      <p>I am <strong>123424.56</strong> years old and another number 1234,567.89</p>
    </div>


    <div data-js-number-counter data-js-number-counter-start-value="5000000">
      <p>Statistics without numbers</p>
    </div>




      <p>I am 2</p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
